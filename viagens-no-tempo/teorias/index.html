<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2263470788888608" crossorigin="anonymous"></script>
<title>TEORIAS REAIS - Viagens no Tempo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial,sans-serif;padding:12px}
.header{text-align:center;padding:18px 10px;background:linear-gradient(135deg,#111,#222);border-radius:16px;border:1px solid #333;margin-bottom:14px}
.header h1{color:#ffcc00;font-size:22px}
.header p{color:#aaa;font-size:12px;margin-top:6px;line-height:1.4}
.badge{display:inline-block;background:#ffcc00;color:#000;font-weight:800;font-size:10px;padding:4px 10px;border-radius:20px;margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:600px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{background:#151515;border:1px solid #2a2a2a;border-radius:14px;overflow:hidden;cursor:pointer;position:relative}
.card:hover{border-color:#ffcc00;transform:scale(1.02)}
.card .thumb{width:100%;height:160px;object-fit:cover;display:block;background:#000}
.card .play-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-75%);width:56px;height:40px;background:#ff0000;border-radius:10px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.6)}
.card .play-icon:after{content:'▶';color:#fff;font-size:20px;margin-left:3px}
.card .info{padding:8px 10px}
.card .num{color:#ffcc00;font-size:10px;font-weight:800}
.card .title{color:#eee;font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a.voltar{display:block;text-align:center;background:#222;color:#ffcc00;padding:12px;border-radius:12px;text-decoration:none;font-weight:800;margin-top:16px;border:1px solid #333}

#player-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;display:none;flex-direction:column}
#player-overlay.ativo{display:flex}
#player-top{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#111;border-bottom:1px solid #333}
#player-top b{color:#ffcc00;font-size:13px}
#player-top button{background:#222;color:#fff;border:1px solid #444;padding:8px 14px;border-radius:20px;font-weight:800;font-size:12px;cursor:pointer;margin-left:6px}
#player-top button.full{background:#ffcc00;color:#000;border-color:#ffcc00}
#player-box{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;background:#000}
#player-box iframe{width:100%;max-width:900px;aspect-ratio:16/9;height:auto;border:0;border-radius:12px;background:#000}
</style>
</head>
<body>
<div class="header">
<h1>🧪 TEORIAS REAIS</h1>
<p>Como a ciência explica a viagem no tempo<br>Relatividade, Buracos de Minhoca e Dilatação</p>
<span class="badge">28 VÍDEOS • PLAYER DENTRO DO SITE</span>
</div>

<div class="grid" id="grid"></div>

<a href="../" class="voltar">⬅️ VOLTAR</a>

<div id="player-overlay">
<div id="player-top">
<b id="player-titulo">TEORIA</b>
<div>
<button class="full" onclick="telaCheia()">⛶ TELA CHEIA NO SITE</button>
<button onclick="fecharPlayer()">✕ FECHAR</button>
</div>
</div>
<div id="player-box"></div>
</div>

<script>
const videos = ["ye6meO1k28g","ZJd3pbiuFRs","q0f7pqjplJQ","N8i6yePA8yY","_aQaHTcenU0","RzNeV8zkyco","EQxHmXBLNds","DE2KAd6UtEQ","tjfqb7dY6tY","PQZj_s24-Oc","s7LN0iuhYZI","O06cQFlxhrs","2xy0HhgQlfI","Cjxy2n0jSxU","1NEKDLyui5M","3h1jlpxAiCY","zacTUeRgCqE","fydtHUzMGgI","E4mhpt6RhVw","qaqkSMjugyg","sl0O_GU1Gzo","wrM-xsfFUqs","-e7R4FA6J3M","UgJh0_k03eI","PUyXUNrvZt0","FI5s-l60H4c","Q3fgqwQ8yTs","5289CvjI9x0"];
const grid=document.getElementById('grid');
videos.forEach((id,i)=>{
  const el=document.createElement('div');
  el.className='card';
  el.innerHTML=`<img class="thumb" src="https://img.youtube.com/vi/${id}/hqdefault.jpg" loading="lazy"><div class="play-icon"></div><div class="info"><div class="num">TEORIA #${String(i+1).padStart(2,'0')}</div><div class="title">Teoria ${String(i+1).padStart(2,'0')}</div></div>`;
  el.onclick=()=>abrirPlayer(id,i+1);
  grid.appendChild(el);
});
function abrirPlayer(id,num){
  document.getElementById('player-titulo').innerText=`TEORIA #${String(num).padStart(2,'0')} - Banco Gratidão`;
  document.getElementById('player-box').innerHTML=`<iframe id="iframe-player" src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&modestbranding=1&rel=0&playsinline=1&fs=1" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
  document.getElementById('player-overlay').classList.add('ativo');
  document.body.style.overflow='hidden';
}
function fecharPlayer(){
  document.getElementById('player-overlay').classList.remove('ativo');
  document.getElementById('player-box').innerHTML='';
  document.body.style.overflow='';
}
function telaCheia(){
  const box=document.getElementById('player-box');
  if(box.requestFullscreen) box.requestFullscreen();
  else if(box.webkitRequestFullscreen) box.webkitRequestFullscreen();
}
document.getElementById('player-overlay').addEventListener('click',e=>{
  if(e.target.id==='player-overlay' || e.target.id==='player-box') fecharPlayer();
});
</script>
</body>
</html>
